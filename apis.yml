aid: brain-corp
name: Brain Corp
description: >-
  Brain Corp builds BrainOS, an autonomy platform that powers commercial
  service robots for floor care, inventory scanning, and remote site
  management across retail, warehouses, education, airports, malls,
  healthcare, and hospitality. The product portfolio includes the BrainOS
  Sense Suite, Clean Suite, ShelfOptix scanning-as-a-service, RFID
  localization, and remote site management tools. Brain Corp integrates with
  OEM partners and operators rather than offering a public developer portal,
  and does not publish open APIs.
